[package]
name = "lakesoul-python"
authors = ["LakeSoul Contributors"]
edition = "2024"
publish = false
version = "1.1.0"
build = "build.rs"

[lib]
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.28", features = [
  "extension-module",
  "experimental-async",
  "abi3-py310",
] }
pyo3-log = "0.13"
log = { workspace = true }
tracing-subscriber.workspace = true
lakesoul-io = { path = "../rust/lakesoul-io", features = ["hdfs"] }
lakesoul-common = { path = "../rust/lakesoul-common" }
lakesoul-metadata = { path = "../rust/lakesoul-metadata" }
proto = { path = "../rust/proto" }
uuid = { workspace = true }
lakesoul-vector = { path = "../rust/lakesoul-vector" }
object_store = { workspace = true }
tokio.workspace = true
arrow-pyarrow.workspace = true
arrow-schema.workspace = true
arrow-array.workspace = true
datafusion-common.workspace = true
datafusion-execution.workspace = true
datafusion-substrait.workspace = true
futures.workspace = true
prost.workspace = true
rootcause.workspace = true
serde_json.workspace = true

# Keep host dependency features aligned with lakesoul-io-c during dist builds.
[build-dependencies]
cbindgen = "0.29.0"

[lints]
workspace = true
